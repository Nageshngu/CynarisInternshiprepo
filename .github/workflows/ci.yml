
name: HealthBridge Python CI

on:
  push:
    branches:
      - main
      - healthbridge-final
  pull_request:
    branches:
      - main
      - healthbridge-final
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AI_Disease_Prediction_Week1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run automated tests
        run: |
          python -m pytest -q
